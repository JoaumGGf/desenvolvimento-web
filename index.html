
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividade JavaScript</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f5f5f5;
        }

        h1 {
            color: #333;
        }

        .destaque {
            color: blue;
            font-weight: bold;
        }

        .feito {
            text-decoration: line-through;
            color: gray;
        }

        li {
            cursor: pointer;
            margin: 8px 0;
        }

        button {
            padding: 10px;
            cursor: pointer;
        }

        input {
            padding: 8px;
            margin: 5px;
        }
    </style>
</head>

<body>

    <h1 id="titulo">Meu Blog</h1>

    <p class="texto">Aprendendo JavaScript.</p>
    <p class="texto">Manipulando elementos HTML.</p>
    <p class="texto">Trabalhando com eventos.</p>

    <h2>Lista de Tarefas</h2>

    <ul id="lista">
        <li>Item inicial 1</li>
        <li>Item inicial 2</li>
        <li>Item inicial 3</li>
    </ul>

    <h2>Eventos</h2>

    <button id="botao">Clique aqui</button>

    <h3>Digite seu nome:</h3>
    <input type="text" id="nome" placeholder="Seu nome">

    <h2>Adicionar Tarefa</h2>

    <form id="formulario">
        <input
            type="text"
            id="tarefa"
            placeholder="Digite uma tarefa"
        >

        <button type="submit">Adicionar</button>
    </form>

    <script src="app.js"></script>

</body>
</html>
